<div class="p-1 text-gray-800 font-sans space-y-4">
  <div class="flex justify-between items-center flex-wrap gap-2">
    <h2 class="font-bold text-base text-gray-800"><i class="bi bi-tools me-2 text-blue-600"></i>Aset & Inventaris RT 5</h2>
    <div class="flex gap-2" id="aset-header-buttons">
      <button onclick="bukaModalPinjamBarang()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-xl text-xs shadow transition flex items-center gap-1">
        <i class="bi bi-plus-lg"></i> Form Peminjaman Barang
      </button>
    </div>
  </div>
  <div class="bg-white rounded-2xl p-1.5 shadow-sm border border-gray-100 flex gap-2">
    <button id="tab-btn-stok" onclick="switchAsetTab('stok')" class="flex-1 py-2 px-3 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm">
      <span>📦</span> Daftar Barang Aset RT
    </button>
    <button id="tab-btn-riwayat" onclick="switchAsetTab('riwayat')" class="flex-1 py-2 px-3 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 text-gray-500 hover:text-gray-700 hover:bg-gray-50">
      <span>📋</span> Riwayat Peminjaman Warga
    </button>
  </div>
  <div id="tab-content-stok" class="block bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 p-4">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-xs text-gray-700 uppercase tracking-wide">📦 Stok Barang Aset RT</h3>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead class="bg-gray-100/70 text-gray-600 uppercase font-semibold border-b">
          <tr>
            <th class="p-3 text-center">NO</th>
            <th class="p-3">NAMA BARANG</th>
            <th class="p-3 text-center">TOTAL STOK</th>
            <th class="p-3 text-center">TERPAKAI</th>
            <th class="p-3 text-center">SISA STOK</th>
            <th class="p-3 text-center">AKSI</th>
          </tr>
        </thead>
        <tbody id="aset-stok-table-body">
          <tr><td colspan="6" class="text-center p-4 text-gray-400">Memuat stok aset...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div id="tab-content-riwayat" class="hidden bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 p-4">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-xs text-gray-700 uppercase tracking-wide">📋 Riwayat Peminjaman Warga</h3>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead class="bg-gray-100/70 text-gray-600 uppercase font-semibold border-b">
          <tr>
            <th class="p-3 text-center">NO</th>
            <th class="p-3">PEMINJAM</th>
            <th class="p-3">BARANG & JUMLAH</th>
            <th class="p-3">TGL PINJAM - KEMBALI</th>
            <th class="p-3 text-center">STATUS</th>
            <th class="p-3 text-center">AKSI</th>
          </tr>
        </thead>
        <tbody id="aset-riwayat-table-body">
          <tr><td colspan="6" class="text-center p-4 text-gray-400">Memuat riwayat peminjaman...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
